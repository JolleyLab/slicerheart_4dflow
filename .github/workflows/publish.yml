name: Publish to PyPI

# Publishes when a GitHub release is published. The package version is taken
# from the release tag (e.g., v0.1.0 -> 0.1.0).
# Requires a PyPI "trusted publisher" for this repository and workflow:
# https://docs.pypi.org/trusted-publishers/

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    # Releases that are not versions (for example, the TestingData release of test files) are not published
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: tests/data
          key: test-data-4dflownet-v1
      - run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - run: python -m pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only publish from releases; manual runs only build and test.
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/slicerheart_4dflow
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
