name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}${{ matrix.vtk != 'latest' && format(' (VTK {0})', matrix.vtk) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        vtk: ["latest"]
        include:
          - os: windows-latest
            python-version: "3.12"
            vtk: "latest"
          - os: macos-latest
            python-version: "3.12"
            vtk: "latest"
          # VTK version of 3D Slicer 5.12, which needs the workaround for
          # tracing in images with a direction matrix (fixed in VTK 9.7)
          - os: ubuntu-latest
            python-version: "3.12"
            vtk: "9.6.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: tests/data
          key: test-data-4dflownet-v1

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" ${{ matrix.vtk != 'latest' && format('vtk=={0}', matrix.vtk) || '' }}

      - name: Run tests
        run: python -m pytest -v -m "not clinical"

  clinical:
    # The clinical test cases (about 4 GB, slicerheart_4dflow.testing_data), extracted once and kept in the Actions
    # cache: the key is the hash of the manifest, which identifies the data set, so a new revision gets a new cache
    name: Clinical test cases (Python 3.12 on ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # base folder of the test data sets, kept in the Actions cache
      SLICERHEART_4DFLOW_TESTDATA: ${{ github.workspace }}/.testingdata_cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore clinical testing data
        id: clinical-data
        uses: actions/cache/restore@v4
        with:
          path: .testingdata_cache
          key: clinical-testing-data-${{ hashFiles('tests/clinical_manifest_*.json') }}

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      # Downloads what the restored cache does not have (all of it on a cache miss); a no-op check otherwise
      - name: Download clinical testing data
        run: python -m slicerheart_4dflow.testing_data download rev002

      # Saved before the tests, so that the cache is kept even if a test fails
      - name: Save clinical testing data
        if: steps.clinical-data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .testingdata_cache
          key: clinical-testing-data-${{ hashFiles('tests/clinical_manifest_*.json') }}

      - name: Run clinical tests
        run: python -m pytest -v -m clinical

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinical-test-reports
          path: .test-reports/
