name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}${{ matrix.vtk != 'latest' && format(' (VTK {0})', matrix.vtk) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        vtk: ["latest"]
        include:
          - os: windows-latest
            python-version: "3.12"
            vtk: "latest"
          - os: macos-latest
            python-version: "3.12"
            vtk: "latest"
          # VTK version of 3D Slicer 5.12, which needs the workaround for
          # tracing in images with a direction matrix (fixed in VTK 9.7)
          - os: ubuntu-latest
            python-version: "3.12"
            vtk: "9.6.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: tests/data
          key: test-data-4dflownet-v1

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" ${{ matrix.vtk != 'latest' && format('vtk=={0}', matrix.vtk) || '' }}

      - name: Run tests
        run: python -m pytest -v
